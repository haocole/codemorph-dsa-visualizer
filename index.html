<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMorph - DSA Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CodeMorph</h1>
        <p>Hệ thống mô phỏng Cấu trúc dữ liệu & Giải thuật (DSA)</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>1. Stack (Ngăn xếp)</h2>
            <p>Mô phỏng cơ chế LIFO (Last In, First Out).</p>
        </section>
        <section class="card">
            <h2>2. Queue (Hàng đợi)</h2>
            <p>Mô phỏng cơ chế FIFO (First In, First Out).</p>
        </section>
    </main>
</body>
</html>
