<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMorph - DSA Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CodeMorph</h1>
        <p>Hệ thống mô phỏng Cấu trúc dữ liệu & Giải thuật (DSA)</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>1. Stack (Ngăn xếp)</h2>
            <p>Mô phỏng cơ chế LIFO (Last In, First Out).</p>
        </section>
        <section class="card">
            <h2>2. Queue (Hàng đợi)</h2>
            <p>Mô phỏng cơ chế FIFO (First In, First Out).</p>
        </section>
    </main>
    <div class="container">
    
    
    <!-- Khu vực điều khiển Stack -->
    <div class="control-section">
        <h3>Stack Visualizer (LIFO)</h3>
        <input type="text" id="stackInput" placeholder="Nhập giá trị...">
        <button onclick="handlePush()">Push</button>
        <button onclick="handlePop()">Pop</button>
    </div>

    <!-- Khu vực hiển thị trực quan Stack -->
    <div id="stackContainer" class="visual-container"></div>
    <script src="app.js"></script>
</div>
</body>
</html>
